[package]
name = "deskfit"
version = "0.1.0"
edition = "2024"
description = "Control a Sportstech DeskFit treadmill over Bluetooth"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
btleplug = "0.13.5"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures = "0.3.34"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uuid = "1.29.0"
